name: bonusku_mobile
description: Bonusku mobile app for presenter commission workflow.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  provider: ^6.1.5
  go_router: ^16.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  open_file: ^4.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/stikesgs_background.png
